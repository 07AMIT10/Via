name: Mini App CI

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"

jobs:
  build-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
