name: Content publish

on:
  push:
    branches: [main]
    paths:
      - "content/problems/**"
      - "content/schema/**"
      - "ingest/**"
      - ".github/workflows/content-publish.yml"

jobs:
  publish-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build content schema
        working-directory: content/schema
        run: npm ci && npm run build

      - name: Validate and emit seed.sql
        working-directory: ingest
        run: npm ci && npm run build && node dist/index.js

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - name: Apply seed to remote D1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute dsa-bot --remote --file=../ingest/seed.sql --yes
